<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
<title>Vanguard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="side">

  <header class="top">
    <div><h1 id="title"></h1><p id="subtitle"></p></div>

  </header>

<script src="app.js"></script>
